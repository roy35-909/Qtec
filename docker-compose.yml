version: "3.9"

services:
  nginx:
    image: nginx:alpine
    ports:
      - "8079:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app1
      - app2
      - app3
    networks:
      - appnet
    restart: unless-stopped

  app1:
    image: ${DOCKER_USERNAME}/myapp:${IMAGE_TAG}
    environment:
      - PORT=8000
    networks:
      - appnet
    restart: unless-stopped

  app2:
    image: ${DOCKER_USERNAME}/myapp:${IMAGE_TAG}
    environment:
      - PORT=8000
    networks:
      - appnet
    restart: unless-stopped

  app3:
    image: ${DOCKER_USERNAME}/myapp:${IMAGE_TAG}
    environment:
      - PORT=8000
    networks:
      - appnet
    restart: unless-stopped

  prometheus:
    image: prom/prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9099:9090"
    networks:
      - appnet
    restart: unless-stopped

  grafana:
    image: grafana/grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD}
    networks:
      - appnet
    restart: unless-stopped

networks:
  appnet:
    driver: bridge