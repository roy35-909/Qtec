version: "3.9"
services:
  nginx:
    image: nginx:alpine
    ports: ["8079:80"]
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on: [app1, app2, app3]

  app1:
    build: .
    environment:
      - PORT=8000
    restart: unless-stopped

  app2:
    build: .
    environment:
      - PORT=8000
    restart: unless-stopped

  app3:
    build: .
    environment:
      - PORT=8000
    restart: unless-stopped
